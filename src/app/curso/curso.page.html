<ion-content [fullscreen]="true" class="bg-slate-950 [--background:transparent]">
    <div
        class="min-h-screen relative flex flex-col font-sans selection:bg-primary-500/30 selection:text-white overflow-hidden">
        <app-fondo-visual variante="estudiante"></app-fondo-visual>

        <!-- Cabecera Premium -->
        <header
            class="fixed top-0 w-full z-[100] bg-white/5 backdrop-blur-2xl border-b border-primary-800/90 px-6 sm:px-10 py-4 flex justify-between items-center h-20 transition-all">
            <div class="flex items-center gap-4">
                <button (click)="toggleSidebar()"
                    class="p-3 bg-white/10 hover:bg-white/20 rounded-2xl border-none text-white cursor-pointer transition-all">
                    <ion-icon [name]="sidebarAbierto ? 'close-outline' : 'menu-outline'" class="text-2xl"></ion-icon>
                </button>
                <div class="flex items-center gap-2">
                    <div class="flex items-center gap-3 group no-underline text-white">
                        <div class="relative">
                            <div
                                class="absolute inset-0 bg-primary-400 blur-xl opacity-20 group-hover:opacity-50 transition-opacity">
                            </div>
                            <app-eco-smart-logo
                                clasePersonalizada="w-10 h-10 relative group-hover:scale-110 transition-all duration-500 ease-out"></app-eco-smart-logo>
                        </div>
                    </div>
                    <div class="w-px h-6 bg-white/10 mx-2 hidden sm:block"></div>
                    <button (click)="volverAlDashboard()"
                        class="p-2 text-slate-400 hover:text-white transition-colors bg-white/5 rounded-xl border-none cursor-pointer">
                        <ion-icon name="arrow-back-outline" class="text-xl"></ion-icon>
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <!-- Progreso-->
                <div *ngIf="!cargando"
                    class="flex items-center gap-2 md:gap-4 bg-white/5 px-3 py-1.5 md:px-4 md:py-2 rounded-2xl border border-white/10 scale-90 sm:scale-100 origin-right transition-all">
                    <div class="text-right">
                        <p
                            class="text-[8px] md:text-[9px] font-black text-primary-50 uppercase tracking-tighter md:tracking-widest leading-none">
                            Progreso</p>
                        <p class="text-xs md:text-sm font-black text-primary-400 leading-none mt-0.5">
                            {{progresoGeneral}}%</p>
                    </div>
                    <div class="w-10 md:w-14 h-1 md:h-2 bg-white/10 rounded-full overflow-hidden shrink-0">
                        <div class="h-full bg-primary-500 transition-all duration-1000"
                            [style.width.%]="progresoGeneral"></div>
                    </div>
                </div>

                <div class="w-px h-6 bg-white/10 hidden md:block"></div>
                <div class="flex items-center gap-4">
                    <button type="button" (click)="cerrarSesion()"
                        class="w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center hover:bg-white/20 hover:scale-105 overflow-hidden border border-white/10 transition-all">
                        <ion-icon name="log-out-outline" class="text-red-500 text-2xl"></ion-icon>
                    </button>
                </div>
            </div>
        </header>

        <div class="flex-1 flex pt-20 h-screen relative overflow-hidden">
            <!-- Menu desplegable -->
            <aside
                class="fixed top-20 bottom-0 left-0 z-[90] w-80 bg-slate-950/95 border-r border-white/10 flex flex-col transition-transform duration-500 ease-[cubic-bezier(0.4,0,0.2,1)] will-change-transform"
                [class.translate-x-0]="sidebarAbierto" [class.-translate-x-full]="!sidebarAbierto && !cargando">

                <div class="p-8 border-b border-white/5 flex items-center gap-3">
                    <div
                        class="w-10 h-10 bg-primary-500/10 rounded-xl flex items-center justify-center text-primary-400 border border-primary-500/20">
                        <ion-icon name="book-outline" class="text-xl"></ion-icon>
                    </div>
                    <div class="overflow-hidden">
                        <h3 class="text-sm font-black text-white uppercase tracking-widest truncate">{{curso?.titulo ||
                            'Contenido'}}</h3>
                        <p class="text-[10px] text-primary-50/80 font-bold uppercase">{{modulos.length}} Módulos</p>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-4">
                    <div *ngFor="let mod of modulos; let i = index" class="space-y-2">
                        <!-- Encabezado del modulo -->
                        <button (click)="toggleModulo(mod)"
                            class="w-full flex items-center justify-between p-4 bg-white/5 hover:bg-white/10 rounded-[1.5rem] border border-white/10 transition-all group border-none cursor-pointer text-left">
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-black text-primary-500 group-hover:text-primary-500">{{i +
                                    1}}.</span>
                                <span class="text-sm font-bold text-primary-50">{{mod.titulo}}</span>
                            </div>
                            <ion-icon [name]="mod.expandido ? 'chevron-up-outline' : 'chevron-down-outline'"
                                class="text-primary-500 transition-transform"></ion-icon>
                        </button>

                        <!-- Lecciones del módulo -->
                        <div *ngIf="mod.expandido" class="space-y-2 pl-4 animate-[fadeIn_0.3s_ease-out]">
                            <button *ngFor="let lec of mod.lecciones" (click)="seleccionarLeccion(lec)"
                                class="w-full flex items-center justify-between p-3 rounded-2xl transition-all border-none cursor-pointer text-left"
                                [ngClass]="leccionActiva?.id === lec.id ? 'bg-primary-500 text-slate-950 shadow-lg shadow-primary-500/20' : 'bg-transparent text-primary-50/70 hover:bg-white/5'">
                                <div class="flex items-center gap-2 overflow-hidden">
                                    <ion-icon [name]="lec.completada ? 'checkmark-circle-outline' : 'book-outline'"
                                        class="text-lg flex-shrink-0"
                                        [ngClass]="leccionActiva?.id === lec.id ? 'text-slate-950' : 'text-primary-400'"></ion-icon>
                                    <span class="text-xs font-bold truncate">{{lec.titulo}}</span>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Overlay en movil (CSS toggle, no *ngIf para no recrear el DOM) -->
            <div (click)="toggleSidebar()"
                class="fixed inset-0 bg-black/60 z-[85] lg:hidden transition-all duration-300"
                [class.opacity-0]="!sidebarAbierto" [class.pointer-events-none]="!sidebarAbierto"
                [class.opacity-100]="sidebarAbierto"></div>

            <!-- Contenido Principal -->
            <main
                class="flex-1 flex flex-col relative z-10 overflow-y-auto custom-scrollbar p-6 lg:p-12 space-y-10 scroll-smooth">
                <div *ngIf="leccionActiva" class="max-w-4xl mx-auto w-full space-y-8 animate-[fadeIn_0.5s_ease-out]">
                    <!-- Encabezado de lección -->
                    <div
                        class="flex flex-col md:flex-row md:items-center justify-between gap-6 pb-6 border-b border-white/10">
                        <div class="space-y-2">
                            <span *ngIf="!leccionActiva.completada"
                                class="text-xs font-black text-red-400 uppercase tracking-[0.2em] bg-red-500/10 px-4 py-1.5 rounded-full border border-red-500/20">
                                Lección en Progreso
                            </span>
                            <span *ngIf="leccionActiva.completada"
                                class="text-xs font-black text-emerald-400 uppercase tracking-[0.2em] bg-emerald-500/10 px-4 py-1.5 rounded-full border border-emerald-500/20">
                                Lección Terminada
                            </span>
                            <h1
                                class="text-4xl md:text-5xl font-black text-primary-500 tracking-tight leading-tight font-heading">
                                {{leccionActiva.titulo}}</h1>
                        </div>
                        <button *ngIf="!leccionActiva.completada" (click)="marcarCompletada()"
                            class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-4 px-8 rounded-[1.5rem] transition-all shadow-xl shadow-emerald-500/20 hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-2 border-none cursor-pointer">
                            <ion-icon name="checkmark-circle-outline" class="text-2xl"></ion-icon>
                            Marcar Completada
                        </button>
                    </div>
                    <!-- Renderización dinámica de bloques de contenido -->
                    <div class="prose prose-invert max-w-none space-y-8 pb-32">

                        <div *ngFor="let bloque of bloquesActivos; trackBy: trackByBloque" [ngSwitch]="bloque.tipo"
                            class="animate-[fadeIn_0.5s_ease-out]">

                            <!-- Títulos -->
                            <h2 *ngSwitchCase="'titulo'"
                                class="text-3xl md:text-4xl font-black text-primary-50 tracking-tight leading-tight mt-12 mb-6">
                                {{bloque.valor}}
                            </h2>

                            <!-- Subtítulos -->
                            <h3 *ngSwitchCase="'subtitulo'"
                                class="text-xl md:text-2xl font-bold text-primary-50 mt-8 mb-4">
                                {{bloque.valor}}
                            </h3>

                            <!-- Párrafo / Texto -->
                            <div *ngSwitchCase="'texto'"
                                class="text-lg text-slate-50 font-medium whitespace-pre-wrap py-4">
                                {{bloque.valor}}
                            </div>

                            <!-- Imagen -->
                            <div *ngSwitchCase="'imagen'"
                                class="my-10 rounded-[3rem] overflow-hidden border border-white/10 shadow-2xl group relative bg-slate-900/50 min-h-[100px]">
                                <img [src]="bloque.valor"
                                    class="w-full h-auto block group-hover:scale-[1.02] transition-transform duration-[2s]"
                                    style="max-height: 800px; object-fit: contain;" alt="Imagen de la lección">
                            </div>

                            <!-- Video -->
                            <div *ngSwitchCase="'video'"
                                class="my-10 aspect-video rounded-[3rem] overflow-hidden border border-white/10 shadow-2xl bg-black flex flex-col items-center justify-center relative">

                                <!-- YouTube -->
                                <iframe *ngIf="bloque.valor && !bloque.valor.startsWith('data:')"
                                    [src]="obtenerUrlVideo(bloque.valor)" class="w-full h-full border-none"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                    allowfullscreen>
                                </iframe>

                                <!-- Local Video -->
                                <video *ngIf="bloque.valor && bloque.valor.startsWith('data:')" [src]="bloque.valor"
                                    controls class="w-full h-full object-contain">
                                </video>

                                <div *ngIf="!bloque.valor" class="text-slate-500 text-center p-8">
                                    <ion-icon name="play-circle-outline" class="text-5xl mb-2"></ion-icon>
                                    <p>Video no disponible</p>
                                </div>
                            </div>

                        </div>

                        <!-- Botones de Navegación -->
                        <div *ngIf="bloquesActivos.length > 0" class="pt-20 pb-10 flex flex-col sm:flex-row items-center justify-center gap-6">
                            
                            <!-- Lección Anterior -->
                            <button *ngIf="!esPrimerLeccion" (click)="irALeccionAnterior()"
                                class="w-full sm:w-auto bg-white/5 hover:bg-white/10 text-white font-black py-5 px-10 rounded-[2rem] transition-all border border-white/10 hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-3 text-lg border-solid cursor-pointer group/prev">
                                <ion-icon name="arrow-back-outline"
                                    class="text-2xl group-hover/prev:-translate-x-2 transition-transform duration-300 text-primary-400"></ion-icon>
                                Lección Anterior
                            </button>

                            <!-- Siguiente Lección -->
                            <button *ngIf="!esUltimaLeccion" (click)="irASiguienteLeccion()"
                                class="w-full sm:w-auto bg-primary-500 hover:bg-primary-400 text-slate-950 font-black py-5 px-12 rounded-[2rem] transition-all shadow-2xl shadow-primary-500/20 hover:-translate-y-2 active:scale-95 flex items-center justify-center gap-3 text-xl border-none cursor-pointer group/next">
                                <span class="tracking-tight">Siguiente Lección</span>
                                <ion-icon name="arrow-forward-outline"
                                    class="text-3xl group-hover/next:translate-x-2 transition-transform duration-300"></ion-icon>
                            </button>

                            <!-- Botón Finalizar (Solo en la última lección si quieres que vuelva al dashboard) -->
                            <button *ngIf="esUltimaLeccion && leccionActiva?.completada" (click)="volverAlDashboard()"
                                class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-5 px-12 rounded-[2rem] transition-all shadow-2xl shadow-emerald-500/20 hover:-translate-y-2 active:scale-95 flex items-center justify-center gap-3 text-xl border-none cursor-pointer group/finish">
                                <span class="tracking-tight">Finalizar Curso</span>
                                <ion-icon name="checkmark-circle-outline" class="text-3xl"></ion-icon>
                            </button>

                            <!-- Botón Marcar como completada (Solo en la última lección si no está completada) -->
                            <button *ngIf="esUltimaLeccion && !leccionActiva?.completada" (click)="marcarCompletada()"
                                class="w-full sm:w-auto bg-primary-500 hover:bg-primary-400 text-slate-950 font-black py-5 px-12 rounded-[2rem] transition-all shadow-2xl shadow-primary-500/20 hover:-translate-y-2 active:scale-95 flex items-center justify-center gap-3 text-xl border-none cursor-pointer group/next">
                                <span class="tracking-tight">Completar Curso</span>
                                <ion-icon name="checkmark-circle-outline" class="text-3xl"></ion-icon>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Cargando -->
                <div *ngIf="!leccionActiva && !cargando"
                    class="flex flex-col items-center justify-center flex-1 space-y-6 opacity-40">
                    <ion-icon name="book-outline" class="text-8xl text-primary-500/30"></ion-icon>
                    <p class="text-slate-500 font-bold italic text-xl">Selecciona una lección para comenzar</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Pantalla de Carga Premium -->
    <div *ngIf="cargando"
        class="fixed inset-0 z-[300] flex flex-col items-center justify-center bg-slate-950/80 backdrop-blur-2xl animate-[fadeIn_0.5s_ease-out]">
        <div class="relative mb-8">
            <div class="absolute inset-0 bg-primary-500 blur-3xl opacity-20 animate-pulse"></div>
            <app-eco-smart-logo clasePersonalizada="w-24 h-24 relative animate-[pulse_2s_infinite_ease-in-out]">
            </app-eco-smart-logo>
        </div>

        <div class="flex flex-col items-center gap-2">
            <h2
                class="text-2xl font-black text-white italic uppercase tracking-tighter animate-[fadeIn_0.5s_ease-out_0.3s_both]">
                Cargando Contenido
            </h2>
            <div class="flex gap-1.5 justify-center">
                <div class="w-2 h-2 bg-primary-500 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                <div class="w-2 h-2 bg-primary-500 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                <div class="w-2 h-2 bg-primary-500 rounded-full animate-bounce"></div>
            </div>
        </div>
    </div>
</ion-content>
