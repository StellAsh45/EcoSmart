<ion-content [fullscreen]="true" class="bg-slate-950 [--background:transparent]">
    <div class="animate-[fadeIn_1s_ease-out]">

        <app-contenedor-autenticacion *ngIf="!exito" titulo="Nueva Contraseña"
            subtitulo="Crea una contraseña segura para proteger tu cuenta de EcoSmart." varianteFondo="misty"
            [mostrarVolver]="true">

            <!-- Mensaje de Error -->
            <div *ngIf="errorMensaje"
                class="mb-8 p-4 bg-red-500/10 text-red-400 rounded-2xl text-sm border border-red-500/20 backdrop-blur-md flex items-center gap-3">
                <span class="w-1.5 h-1.5 rounded-full bg-red-400 animate-pulse"></span>
                {{errorMensaje}}
            </div>

            <!-- Formulario -->
            <form class="space-y-10" [formGroup]="formularioReset" (ngSubmit)="actualizarPassword()">

                <!-- Contraseña -->
                <app-campo-entrada etiqueta="Nueva Contraseña" [icono]="iconos.contrasena" placeholder="••••••••"
                    tipo="password" [control]="$any(formularioReset.get('contrasena'))"
                    [tieneErroresPersonalizados]="true">

                    <div errores class="space-y-1">
                        <p class="font-bold mb-1 text-xs">La contraseña debe contener:</p>
                        <ul class="space-y-0.5 opacity-90 text-[10px]">
                            <li class="flex items-center gap-1.5"
                                [class.text-emerald-400]="formularioReset.get('contrasena')?.value?.length >= 6">
                                <div class="w-1 h-1 rounded-full bg-current"></div> Mínimo 6 caracteres
                            </li>
                            <li class="flex items-center gap-1.5"
                                [class.text-emerald-400]="formularioReset.get('contrasena')?.value && !formularioReset.get('contrasena')?.errors?.['pattern']">
                                <div class="w-1 h-1 rounded-full bg-current"></div> Mayúscula, número y símbolo
                            </li>
                        </ul>
                    </div>
                </app-campo-entrada>

                <!-- Confirmar Contraseña -->
                <app-campo-entrada etiqueta="Confirmar Contraseña" [icono]="iconos.contrasena" placeholder="••••••••"
                    tipo="password" [control]="$any(formularioReset.get('confirmarContrasena'))">
                </app-campo-entrada>

                <!-- Botón -->
                <button type="submit" [disabled]="cargando"
                    class="w-full bg-primary-500 text-slate-950 py-4 rounded-2xl font-black hover:bg-primary-400 transition-all flex items-center justify-center gap-2 group/btn shadow-xl shadow-primary-500/20 active:scale-95 text-lg">
                    <ng-container *ngIf="cargando; else actionText">
                        <ion-icon name="sync-outline" class="w-6 h-6 animate-spin"></ion-icon>
                    </ng-container>
                    <ng-template #actionText>
                        Actualizar Contraseña
                        <ion-icon name="arrow-forward-outline"
                            class="w-5 h-5 group-hover/btn:translate-x-1 transition-transform"></ion-icon>
                    </ng-template>
                </button>
            </form>
        </app-contenedor-autenticacion>

        <!-- Vista de Éxito -->
        <app-contenedor-autenticacion *ngIf="exito" titulo="¡Contraseña Actualizada!"
            subtitulo="Tu acceso ha sido restablecido correctamente." varianteFondo="deep">

            <div class="relative py-4 flex flex-col items-center text-center">
                <div
                    class="w-24 h-24 bg-primary-400/20 rounded-full flex items-center justify-center mb-8 border border-primary-400/30">
                    <ion-icon name="lock-open-outline" class="text-6xl text-primary-400"></ion-icon>
                </div>

                <p class="text-primary-50 text-sm mb-12 italic">
                    Ya puedes volver a utilizar tu cuenta de EcoSmart con tu nueva contraseña.
                </p>

                <a routerLink="/dashboard-estudiante"
                    class="w-full bg-primary-500 text-slate-950 py-4 rounded-2xl font-black hover:bg-primary-400 transition-all flex items-center justify-center gap-2 group shadow-xl shadow-primary-500/20 active:scale-95 text-lg no-underline">
                    Ir a tu dashboard
                    <ion-icon name="arrow-forward-outline"
                        class="w-5 h-5 group-hover:translate-x-1 transition-transform"></ion-icon>
                </a>
            </div>
        </app-contenedor-autenticacion>
    </div>
</ion-content>
