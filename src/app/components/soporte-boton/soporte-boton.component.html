<!-- Botón flotante -->
<div *ngIf="mostrarBoton" class="fixed bottom-6 right-6 z-50">
  <button 
    (click)="abrirSoporte()"
    class="relative group w-14 h-14 rounded-full flex items-center justify-center transition-all duration-300 shadow-[0_4px_20px_rgba(0,0,0,0.3)] bg-slate-800 opacity-60 hover:opacity-100 hover:scale-110 border-none cursor-pointer overflow-hidden">
    
    <!-- Efecto de gradiente en hover -->
    <div class="absolute inset-0 bg-gradient-to-tr from-primary-500 to-emerald-400 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
    
    <!-- Ícono -->
    <ion-icon 
      name="chatbubbles-outline" 
      class="text-3xl text-white relative z-10 transition-transform duration-300 group-hover:rotate-12">
    </ion-icon>

    <!-- Ping de atención sutil (opcional) -->
    <div class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-slate-900 group-hover:border-emerald-500 transition-colors"></div>
  </button>
</div>
