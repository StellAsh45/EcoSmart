<ion-header class="ion-no-border">
  <ion-toolbar class="bg-slate-900 border-b border-white/10">
    <ion-title class="text-white font-heading font-black">Soporte</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()" class="text-white/70 hover:text-white transition-colors">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-slate-900 [--background:transparent]">
  <div class="p-6 h-full flex flex-col font-sans bg-slate-900">
    
    <div class="mb-6">
      <h2 class="text-2xl font-black text-white tracking-tight font-heading mb-2">
        ¿En qué podemos <span class="text-primary-400">ayudarte?</span>
      </h2>
      <p class="text-slate-400 text-sm">
        Describe tu problema o solicitud. Te enviaremos la respuesta a tu correo.
      </p>
    </div>

    <!-- Formulario -->
    <div class="space-y-5 flex-1">
      
      <!-- Correo (Deshabilitado) -->
      <div class="space-y-2">
        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Tu Correo</label>
        <div class="bg-slate-800/50 border border-white/10 rounded-xl px-4 py-3 flex items-center">
          <input 
            type="email" 
            [value]="email" 
            disabled
            class="bg-transparent border-none w-full text-slate-300 font-medium focus:ring-0 cursor-not-allowed opacity-70"
          >
        </div>
      </div>

      <!-- Problema -->
      <div class="space-y-2 flex-1 flex flex-col">
        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Descripción del problema</label>
        <div class="bg-white/5 border border-white/10 rounded-xl p-1 flex-1 relative group focus-within:border-primary-500/50 transition-colors">
          <textarea 
            [(ngModel)]="problema"
            placeholder="Escribe aquí los detalles..."
            class="bg-transparent border-none w-full h-40 resize-none text-white p-3 focus:ring-0 placeholder:text-slate-500 font-medium"
          ></textarea>
        </div>
      </div>

    </div>

    <!-- Botón Enviar -->
    <div class="mt-8 pt-4 border-t border-white/10">
      <button 
        (click)="enviarSoporte()" 
        [disabled]="enviando"
        class="w-full bg-primary-500 hover:bg-primary-400 text-slate-900 font-black py-4 px-6 rounded-xl transition-all shadow-lg shadow-primary-500/20 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 group cursor-pointer border-none"
      >
        <ng-container *ngIf="!enviando">
          <ion-icon name="paper-plane-outline" class="text-xl group-hover:scale-110 transition-transform"></ion-icon>
          <span>Enviar Solicitud</span>
        </ng-container>
        <ng-container *ngIf="enviando">
          <div class="w-5 h-5 border-2 border-slate-900/20 border-t-slate-900 rounded-full animate-spin"></div>
          <span>Enviando...</span>
        </ng-container>
      </button>
    </div>

  </div>
</ion-content>
