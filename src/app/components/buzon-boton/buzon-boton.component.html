<button 
  (click)="abrirBuzon()"
  class="relative w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center hover:bg-white/20 hover:scale-105 overflow-hidden transition-all border-none cursor-pointer group">
  
  <ion-icon 
    [name]="mensajesNoLeidos > 0 ? 'mail-unread-outline' : 'mail-open-outline'" 
    class="text-primary-400 text-2xl group-hover:scale-110 transition-transform">
  </ion-icon>

  <!-- Globo rojo de notificaciones -->
  <div *ngIf="mensajesNoLeidos > 0" 
       class="absolute top-2 right-2 w-5 h-5 bg-red-500 rounded-full flex items-center justify-center border-2 border-slate-900 shadow-lg animate-bounce">
    <span class="text-[10px] font-black text-white leading-none">{{ mensajesNoLeidos > 9 ? '9+' : mensajesNoLeidos }}</span>
  </div>
</button>
