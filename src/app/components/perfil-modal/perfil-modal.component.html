<ion-content [fullscreen]="true" class="perfil-modal-content">
  <div class="perfil-bg">
    <img
      src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=80"
      alt="Bosque"
      class="perfil-bg-image"
    />
    <div class="perfil-bg-overlay"></div>
    <div class="perfil-bg-gradient"></div>
  </div>

  <div class="perfil-modal-shell">
    <div class="perfil-card">
      <div class="perfil-topbar">
        <button type="button" class="volver-btn" (click)="cerrar()">
          <ion-icon name="arrow-back-outline"></ion-icon>
          Volver al Dashboard
        </button>

        <button type="button" class="logout-fake-btn" disabled>
          Perfil de estudiante
        </button>
      </div>

      <div *ngIf="cargando" class="estado-box">
        <ion-spinner name="crescent"></ion-spinner>
        <p>Cargando perfil...</p>
      </div>

      <div *ngIf="!cargando" class="perfil-card-body">
        <div class="perfil-header">
          <div class="perfil-avatar-box">
            <ion-icon name="person-circle-outline"></ion-icon>
          </div>

          <div class="perfil-header-text">
            <p class="perfil-kicker">Tu Perfil</p>
            <h2>Actualiza tu información</h2>
            <p class="perfil-subtitle">
              Administra tus datos personales y seguridad de acceso.
            </p>
          </div>
        </div>

        <div *ngIf="mensaje" class="mensaje-box ok">
          {{ mensaje }}
        </div>

        <div *ngIf="error" class="mensaje-box error">
          {{ error }}
        </div>

        <div class="perfil-section">
          <h3>Información personal</h3>

          <div class="form-grid">
            <div class="campo">
              <label>Nombre completo</label>
              <input
                [(ngModel)]="nombre"
                type="text"
                placeholder="Tu nombre completo"
                [class.is-invalid]="nombreError"
              />
              <span class="error-text" *ngIf="nombreError">{{ nombreError }}</span>
            </div>

            <div class="campo">
              <label>Correo</label>
              <input
                [(ngModel)]="correo"
                type="email"
                disabled
                placeholder="Correo electrónico"
              />
            </div>

            <div class="campo campo-full">
              <label>Biografía e intereses</label>
              <textarea
                [(ngModel)]="biografia"
                rows="4"
                placeholder="Cuéntanos un poco sobre ti, tus intereses o enfoque de aprendizaje..."
              ></textarea>
            </div>
          </div>
        </div>

        <div class="perfil-section">
          <h3>
            <ion-icon name="lock-closed-outline"></ion-icon>
            Seguridad
          </h3>

          <div class="form-grid">
            <div class="campo">
              <label>Contraseña actual</label>
              <input
                [(ngModel)]="contrasenaActual"
                type="password"
                placeholder="Ingresa tu contraseña actual"
                [class.is-invalid]="contrasenaActualError"
              />
              <span class="error-text" *ngIf="contrasenaActualError">{{ contrasenaActualError }}</span>
            </div>

            <div class="campo">
              <label>Nueva contraseña</label>
              <input
                [(ngModel)]="nuevaContrasena"
                type="password"
                placeholder="Nueva contraseña (mín. 6 caracteres, 1 mayúscula, 1 número, 1 símbolo)"
                [class.is-invalid]="nuevaContrasenaError"
              />
              <span class="error-text" *ngIf="nuevaContrasenaError">{{ nuevaContrasenaError }}</span>
            </div>

            <div class="campo campo-full">
              <label>Confirmar nueva contraseña</label>
              <input
                [(ngModel)]="confirmarNuevaContrasena"
                type="password"
                placeholder="Confirma la nueva contraseña"
                [class.is-invalid]="confirmarContrasenaError"
              />
              <span class="error-text" *ngIf="confirmarContrasenaError">{{ confirmarContrasenaError }}</span>
            </div>
          </div>
        </div>

        <div class="acciones">
          <button
            type="button"
            class="guardar-btn"
            (click)="guardarPerfil()"
            [disabled]="guardando"
          >
            <ion-icon name="save-outline"></ion-icon>
            {{ guardando ? 'Guardando...' : 'Actualizar Perfil' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</ion-content>
